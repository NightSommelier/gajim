name: Gajim CI

on:
  push:
    branches:
      - master
    tags:
      - 'gajim-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing gajim-* tag to republish (leave empty for build-only)"
        required: false
        type: string

jobs:
  linux-amd64:
    if: github.event_name == 'pull_request'
    runs-on: debian-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          test "$(dpkg --print-architecture)" = amd64
          test "$(uname -m)" = x86_64

      - name: Install system dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi

          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            appstream-util \
            build-essential \
            gettext \
            gir1.2-adw-1 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libadwaita-1-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libsqlite3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-venv \
            xauth \
            xvfb

      - name: Create Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            --editable . \
            build \
            codespell==2.4.2 \
            pytest \
            ruff==0.15.7

      - name: Run unit tests
        run: xvfb-run -a .venv/bin/python -m pytest -q

      - name: Run Ruff checks
        run: |
          .venv/bin/ruff check
          .venv/bin/ruff format --check

      - name: Check spelling
        run: .venv/bin/codespell

  linux-amd64-build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: debian-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          test "$(dpkg --print-architecture)" = amd64
          test "$(uname -m)" = x86_64

      - name: Install system dependencies
        run: |
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi

          $SUDO apt-get update
          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            appstream-util \
            build-essential \
            gettext \
            gir1.2-adw-1 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-4.0 \
            gir1.2-gtksource-5 \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            libadwaita-1-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-2.0-dev \
            libglib2.0-dev \
            libgtk-4-dev \
            libgtksourceview-5-dev \
            libsqlite3-dev \
            libssl-dev \
            libsoup-3.0-dev \
            pkg-config \
            python3 \
            python3-dev \
            python3-venv

      - name: Create Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable . build

      - name: Build metadata and Python packages
        run: |
          .venv/bin/python ./make.py build
          appstream-util validate dist/metadata/org.gajim.Gajim.metainfo.xml
          .venv/bin/python -m build

      - name: Upload Linux packages
        uses: actions/upload-artifact@v3
        with:
          name: gajim-linux-amd64-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/metadata/*
          if-no-files-found: error

  macos-arm64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install \
            adwaita-icon-theme \
            gettext \
            gstreamer \
            gst-python \
            gtk4 \
            gtksourceview5 \
            libadwaita \
            libspelling \
            librsvg \
            libsoup@3 \
            pygobject3 \
            python@3.14

      - name: Create Python environment
        env:
          HOMEBREW_PREFIX: /opt/homebrew
          GI_TYPELIB_PATH: /opt/homebrew/lib/girepository-1.0:/opt/homebrew/opt/gtksourceview5/lib/girepository-1.0:/opt/homebrew/opt/libspelling/lib/girepository-1.0:/opt/homebrew/share/gir-1.0
          XDG_DATA_DIRS: /opt/homebrew/share
          DYLD_LIBRARY_PATH: /opt/homebrew/lib
        run: |
          export PATH="$HOMEBREW_PREFIX/bin:$HOMEBREW_PREFIX/opt/python@3.14/bin:$PATH"
          "$HOMEBREW_PREFIX/opt/python@3.14/bin/python3.14" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            --editable . \
            pyobjc-framework-Cocoa \
            pyinstaller

      - name: Build macOS application and disk image
        env:
          HOMEBREW_PREFIX: /opt/homebrew
          GI_TYPELIB_PATH: /opt/homebrew/lib/girepository-1.0:/opt/homebrew/opt/gtksourceview5/lib/girepository-1.0:/opt/homebrew/opt/libspelling/lib/girepository-1.0:/opt/homebrew/share/gir-1.0
          XDG_DATA_DIRS: /opt/homebrew/share
          DYLD_LIBRARY_PATH: /opt/homebrew/lib
        run: |
          export PATH="$PWD/.venv/bin:$HOMEBREW_PREFIX/bin:$HOMEBREW_PREFIX/opt/python@3.14/bin:$PATH"
          .venv/bin/python mac/makebundle.py --version "${GITHUB_SHA:-ci}"

      - name: Smoke test macOS application
        run: |
          test -x dist/Gajim.app/Contents/MacOS/launch
          dist/Gajim.app/Contents/MacOS/launch --help
          test -z "$(find dist/Gajim.app/Contents/Frameworks -type f \( -name 'libgtk-3*' -o -name 'libgdk-3*' \) -print -quit)"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v3
        with:
          name: gajim-macos-arm64-${{ github.sha }}
          path: gajim-*.dmg
          if-no-files-found: error
          retention-days: 7

  windows-amd64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-amd64
    env:
      MSYSTEM: UCRT64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Windows build host
        shell: cmd
        run: |
          if /I not "%PROCESSOR_ARCHITECTURE%"=="AMD64" (
            echo Windows runner must be amd64, got %PROCESSOR_ARCHITECTURE%
            exit /b 1
          )
          if not exist "C:\msys64\usr\bin\bash.exe" (
            echo MSYS2 bash was not found at C:\msys64\usr\bin\bash.exe
            exit /b 1
          )
          where /R "%ProgramFiles(x86)%\Windows Kits\10\bin" makeappx.exe >NUL 2>&1 || (
            echo Windows SDK makeappx.exe was not found
            exit /b 1
          )
          where /R "%ProgramFiles(x86)%\Windows Kits\10\bin" makepri.exe >NUL 2>&1 || (
            echo Windows SDK makepri.exe was not found
            exit /b 1
          )

      - name: Build Windows installers
        shell: C:/msys64/usr/bin/bash.exe --login -eo pipefail {0}
        run: |
          export PATH="/ucrt64/bin:/usr/bin:$PATH"
          test "$MSYSTEM" = UCRT64
          test "$(uname -m)" = x86_64
          ./win/build.sh

      - name: Upload Windows installers
        uses: actions/upload-artifact@v3
        with:
          name: gajim-windows-amd64-${{ github.sha }}
          path: |
            win/_build_root/Gajim.exe
            win/_build_root/Gajim-Portable.exe
            win/_build_root/Gajim.msixbundle
          if-no-files-found: error
          retention-days: 7

  release:
    if: >
      (forgejo.event_name == 'push' && startsWith(forgejo.ref, 'refs/tags/gajim-')) ||
      (forgejo.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'gajim-'))
    needs:
      - linux-amd64-build
      - macos-arm64
      - windows-amd64
    runs-on: debian-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || forgejo.ref_name }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release_ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag || forgejo.ref_name }}
        shell: bash
        run: |
          echo "tag=${RELEASE_TAG}" >> "$FORGEJO_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$FORGEJO_OUTPUT"

      - name: Download Linux packages
        uses: actions/download-artifact@v3
        with:
          name: gajim-linux-amd64-${{ forgejo.sha }}
          path: dist/release

      - name: Download macOS disk image
        uses: actions/download-artifact@v3
        with:
          name: gajim-macos-arm64-${{ forgejo.sha }}
          path: dist/release

      - name: Download Windows installers
        uses: actions/download-artifact@v3
        with:
          name: gajim-windows-amd64-${{ forgejo.sha }}
          path: dist/release

      - name: Verify release files
        shell: bash
        run: |
          test -n "$(find dist/release -maxdepth 1 -type f -print -quit)"
          test -z "$(find dist/release -mindepth 1 -maxdepth 1 -type d -print -quit)"

      - name: Create release notes
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          cat > release-notes.md <<EOF
          This pre-release is built from the patched fork at tag ${RELEASE_TAG}.

          It contains the macOS GTK4/GStreamer packaging fixes, inline formatting fixes,
          legacy nbxmpp connectivity compatibility, Forgejo CI packaging changes,
          and the Windows MSYS2/UCRT64 installers.
          EOF

      - name: Update Forgejo pre-release
        uses: actions/forgejo-release@v2
        with:
          tag: ${{ steps.release_ref.outputs.tag }}
          sha: ${{ steps.release_ref.outputs.sha }}
          release-dir: dist/release
          release-notes-file: release-notes.md
          title: Gajim ${{ steps.release_ref.outputs.tag }}
          direction: upload
          prerelease: true
          override: true
