name: Gajim macOS Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  macos:
    env:
      FTP_USER: ${{ secrets.ftp_user }}
      FTP_PASSWORD: ${{ secrets.ftp_password }}
      FTP_SERVER: ${{ secrets.ftp_server }}
    strategy:
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mac/
    steps:
      - uses: actions/checkout@v4
      - name: Build Gajim
        run: bash gajim-macos-helper.sh build ci
      - name: Create Gajim dmg
        run: bash gajim-macos-helper.sh create-dmg ci
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: Upload nightly DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: gajim-nightly-macos-${{ matrix.arch }}
          path: gajim-source/gajim-*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload dmg file via FTPS
        if: env.FTP_USER != '' && env.FTP_PASSWORD != '' && env.FTP_SERVER != ''
        run: >-
          PATH=/opt/homebrew/opt/curl/bin:$PATH curl --fail --retry 3 --retry-all-errors
          --ftp-ssl-reqd --user "$FTP_USER:$FTP_PASSWORD"
          -T gajim-source/gajim-*.dmg
          "ftp://$FTP_SERVER/./downloads/snap/macos/Gajim-Nightly-${{ matrix.arch }}-${{ steps.date.outputs.date }}.dmg"
