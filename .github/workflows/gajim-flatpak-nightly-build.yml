name: Gajim Flatpak Nightly Build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

jobs:
  flatpak:
    env:
      FTP_USER: ${{ secrets.ftp_user }}
      FTP_PASSWORD: ${{ secrets.ftp_password }}
      FTP_SERVER: ${{ secrets.ftp_server }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ hashFiles('flatpak/**') }}
          restore-keys: flatpak-builder-${{ matrix.arch }}-
      - name: Install flatpak-builder
        run: sudo apt install -y flatpak flatpak-builder
      - name: Add flathub repository
        run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build flatpak
        run: |
          for attempt in 1 2 3; do
            if flatpak-builder --user --repo=flatpak_repo --install-deps-from=flathub --force-clean flatpak_build flatpak/org.gajim.Gajim.Devel.yaml; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            echo "Flatpak source download failed; retrying in 20 seconds ($attempt/3)" >&2
            rm -rf flatpak_build
            sleep 20
          done
      - name: Create single-file bundle
        run: flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo flatpak_repo "gajim-nightly-${{ matrix.arch }}.flatpak" org.gajim.Gajim.Devel
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
      - name: Upload nightly Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: gajim-nightly-${{ matrix.arch }}
          path: gajim-nightly-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 14
      - name: Upload flatpak bundle via FTPS
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ] || [ -z "$FTP_SERVER" ]; then
            echo "FTPS credentials are not configured; skipping nightly upload"
            exit 0
          fi
          curl --fail --retry 3 --retry-all-errors --ftp-ssl-reqd \
            --user "$FTP_USER:$FTP_PASSWORD" \
            -T "gajim-nightly-${{ matrix.arch }}.flatpak" \
            "ftp://$FTP_SERVER/./downloads/snap/linux/Gajim-${{ steps.date.outputs.date }}-${{ matrix.arch }}.flatpak"
