name: Gajim CI

on:
  push:
    branches:
      - master
    tags:
      - 'gajim-*'
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing gajim-* tag to republish (leave empty for build-only)"
        required: false
        type: string

jobs:
  linux-amd64:
    if: github.event_name == 'pull_request'
    runs-on: linux-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify runner architecture
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Install Python dependencies
        run: nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --run 'uv sync --locked'

      - name: Run unit tests
        run: |
          # shellcheck disable=SC2016
          nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --run '
            Xvfb :99 -screen 0 1280x1024x24 >/tmp/gajim-xvfb.log 2>&1 &
            XVFB_PID=$!
            trap '\''kill "$XVFB_PID"'\'' EXIT
            DISPLAY=:99 uv run python -m pytest -q
          '

      - name: Run Ruff checks
        run: |
          nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --run '
            uv run ruff check
            uv run ruff format --check
          '

      - name: Check spelling
        run: nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --run 'uv run codespell'

  linux-amd64-build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: linux-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify runner architecture
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Install Python dependencies
        run: nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --run 'uv sync --locked'

      - name: Build metadata and Python packages
        run: |
          nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --run '
            uv run python ./make.py build --dist=unix
            appstreamcli validate dist/metadata/org.gajim.Gajim.metainfo.xml
            uv build
            ./linux/build-portable.sh
          '

      - name: Stage Linux packages
        run: |
          mkdir -p ci-artifacts
          cp dist/*.tar.gz dist/*.whl dist/metadata/* ci-artifacts/

      - name: Upload Linux packages
        uses: actions/upload-artifact@v3
        with:
          name: gajim-linux-amd64-${{ github.sha }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 7

  flatpak-amd64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: flatpak-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify runner architecture
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          command -v nix-shell

      - name: Build Flatpak bundle
        run: nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --run 'bash .forgejo/scripts/build-flatpak.sh'

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v3
        with:
          name: gajim-flatpak-amd64-${{ github.sha }}
          path: ci-artifacts/gajim-flatpak.flatpak
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify runner architecture
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install \
            adwaita-icon-theme \
            gettext \
            gstreamer \
            gst-python \
            gtk4 \
            gtksourceview5 \
            libadwaita \
            libspelling \
            librsvg \
            libsoup@3 \
            pygobject3 \
            python@3.14

      - name: Create Python environment
        env:
          HOMEBREW_PREFIX: /opt/homebrew
          GI_TYPELIB_PATH: /opt/homebrew/lib/girepository-1.0:/opt/homebrew/opt/gtksourceview5/lib/girepository-1.0:/opt/homebrew/opt/libspelling/lib/girepository-1.0:/opt/homebrew/share/gir-1.0
          XDG_DATA_DIRS: /opt/homebrew/share
          DYLD_LIBRARY_PATH: /opt/homebrew/lib
        run: |
          export PATH="$HOMEBREW_PREFIX/bin:$HOMEBREW_PREFIX/opt/python@3.14/bin:$PATH"
          "$HOMEBREW_PREFIX/opt/python@3.14/bin/python3.14" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            --editable . \
            pyobjc-framework-Cocoa \
            pyinstaller

      - name: Build macOS application and disk image
        env:
          HOMEBREW_PREFIX: /opt/homebrew
          GI_TYPELIB_PATH: /opt/homebrew/lib/girepository-1.0:/opt/homebrew/opt/gtksourceview5/lib/girepository-1.0:/opt/homebrew/opt/libspelling/lib/girepository-1.0:/opt/homebrew/share/gir-1.0
          XDG_DATA_DIRS: /opt/homebrew/share
          DYLD_LIBRARY_PATH: /opt/homebrew/lib
          FORGEJO_SHA: ${{ github.sha }}
        run: |
          export PATH="$PWD/.venv/bin:$HOMEBREW_PREFIX/bin:$HOMEBREW_PREFIX/opt/python@3.14/bin:$PATH"
          .venv/bin/python mac/makebundle.py --version "${FORGEJO_SHA:-ci}"

      - name: Smoke test macOS application
        run: |
          test -x dist/Gajim.app/Contents/MacOS/launch
          dist/Gajim.app/Contents/MacOS/launch --help
          test -z "$(find dist/Gajim.app/Contents/Frameworks -type f \( -name 'libgtk-3*' -o -name 'libgdk-3*' \) -print -quit)"

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v3
        with:
          name: gajim-macos-arm64-${{ github.sha }}
          path: gajim-*.dmg
          if-no-files-found: error
          retention-days: 7

  windows-amd64-cross:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-cross-amd64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify Linux cross-build host
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          command -v nix-shell
          test -n "$GAJIM_MINGW_ROOT"
          test -n "$GAJIM_MINGW_DEV_ROOT"
          test -f "$GAJIM_MINGW_ROOT/bin/python3.14.exe"

      - name: Build Windows installers without Wine
        run: |
          nix-shell "${GAJIM_NIX_SHELL:-/home/sommelier/projects/gajim/nix/shell.nix}" --arg withWindowsCross true --run '
            test -x win/build-cross-direct.sh
            ./win/build-cross-direct.sh
          '

      - name: Upload Windows installers
        uses: actions/upload-artifact@v3
        with:
          name: gajim-windows-amd64-${{ github.sha }}
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/gajim-')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'gajim-'))
    needs:
      - linux-amd64-build
      - flatpak-amd64
      - macos-arm64
      - windows-amd64-cross
    runs-on: linux-amd64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release_ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          echo "tag=${RELEASE_TAG}" >> "$FORGEJO_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$FORGEJO_OUTPUT"

      - name: Download Linux packages
        uses: actions/download-artifact@v3
        with:
          name: gajim-linux-amd64-${{ github.sha }}
          path: dist/release/linux

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v3
        with:
          name: gajim-flatpak-amd64-${{ github.sha }}
          path: dist/release/flatpak

      - name: Download macOS disk image
        uses: actions/download-artifact@v3
        with:
          name: gajim-macos-arm64-${{ github.sha }}
          path: dist/release/macos

      - name: Download Windows installers
        uses: actions/download-artifact@v3
        with:
          name: gajim-windows-amd64-${{ github.sha }}
          path: dist/release/windows

      - name: Verify release files
        shell: bash
        run: |
          find dist/release -mindepth 1 -type f -exec cp {} dist/release/ \;
          find dist/release -mindepth 1 -type d -prune -exec rm -rf {} +
          test -n "$(find dist/release -maxdepth 1 -type f -print -quit)"
          test -z "$(find dist/release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -z "$(find dist/release -maxdepth 1 -type f -size 0 -print -quit)"
          ls -lh dist/release

      - name: Create release notes
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-creatordate --list 'gajim-*' | grep -vxF "$RELEASE_TAG" | head -n 1 || true)
          {
            echo "This pre-release is built from the patched fork at tag ${RELEASE_TAG}."
            echo
            echo "Included fixes and changes:"
            if [ -n "$PREVIOUS_TAG" ]; then
              git log --format='- %s' "$PREVIOUS_TAG..$RELEASE_TAG" | head -n 40
            else
              git log --format='- %s' -n 40 "$RELEASE_TAG"
            fi
            echo
            echo "Builds: Linux amd64, Flatpak amd64, macOS arm64, and Windows amd64."
          } > release-notes.md

      - name: Update Forgejo pre-release
        uses: actions/forgejo-release@v2
        with:
          tag: ${{ steps.release_ref.outputs.tag }}
          sha: ${{ steps.release_ref.outputs.sha }}
          release-dir: dist/release
          release-notes-file: release-notes.md
          title: Gajim ${{ steps.release_ref.outputs.tag }}
          direction: upload
          prerelease: true
          override: true
