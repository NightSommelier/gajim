name: Build and release packages

on:
  push:
    branches: [master]
    tags: ['gajim-*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing gajim-* tag to build and publish
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: linux-uv-${{ hashFiles('pyproject.toml') }}
          restore-keys: linux-uv-
      - name: Test and build Linux packages
        run: |
          # shellcheck disable=SC2016
          nix-shell .github/nix/shell.nix --run '
            uv sync
            Xvfb :99 -screen 0 1280x1024x24 >/tmp/gajim-xvfb.log 2>&1 &
            xvfb_pid=$!
            trap "kill $xvfb_pid" EXIT
            DISPLAY=:99 uv run python -m pytest -q
            uv run ruff check
            uv run ruff format --check
            uv run codespell
            uv run python make.py build --dist=unix
            appstreamcli validate dist/metadata/org.gajim.Gajim.metainfo.xml
            uv build
            ./linux/build-portable.sh
          '
      - uses: actions/upload-artifact@v4
        with:
          name: gajim-linux-amd64
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 14

  flatpak-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Flatpak host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
      - name: Build Flatpak bundle
        run: bash .forgejo/scripts/build-flatpak.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gajim-flatpak-amd64
          path: ci-artifacts/gajim-flatpak.flatpak
          if-no-files-found: error
          retention-days: 14

  windows-amd64:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git
      - uses: actions/cache@v4
        with:
          path: C:\msys64\var\cache\pacman\pkg
          key: windows-ucrt64-${{ hashFiles('win/_base.sh', 'win/build.sh') }}
          restore-keys: windows-ucrt64-
      - name: Verify Windows packaging tools
        run: |
          test -n "$(find '/c/Program Files (x86)/Windows Kits/10/bin' -path '*/x64/makeappx.exe' -print -quit)"
          test -n "$(find '/c/Program Files (x86)/Windows Kits/10/bin' -path '*/x64/makepri.exe' -print -quit)"
      - name: Build Windows installers and Store bundle
        run: |
          export GAJIM_BUILD_ROOT="$(cygpath -u "$RUNNER_TEMP")/gajim-windows-build"
          ./win/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: gajim-windows-amd64
          path: |
            ${{ runner.temp }}/gajim-windows-build/Gajim.exe
            ${{ runner.temp }}/gajim-windows-build/Gajim.msixbundle
          if-no-files-found: error
          retention-days: 14

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install adwaita-icon-theme gettext gstreamer gst-python gtk4 \
            gtksourceview5 libadwaita libspelling librsvg libsoup@3 pygobject3 \
            python@3.14
      - name: Build macOS disk image
        env:
          HOMEBREW_PREFIX: /opt/homebrew
          GI_TYPELIB_PATH: /opt/homebrew/lib/girepository-1.0:/opt/homebrew/opt/gtksourceview5/lib/girepository-1.0:/opt/homebrew/opt/libspelling/lib/girepository-1.0:/opt/homebrew/share/gir-1.0
          XDG_DATA_DIRS: /opt/homebrew/share
          DYLD_LIBRARY_PATH: /opt/homebrew/lib
          BUNDLE_VERSION: ${{ github.sha }}
        run: |
          export PATH="$HOMEBREW_PREFIX/bin:$HOMEBREW_PREFIX/opt/python@3.14/bin:$PATH"
          python3.14 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --editable . pyobjc-framework-Cocoa pyinstaller
          export PATH="$PWD/.venv/bin:$PATH"
          python mac/makebundle.py --version "$BUNDLE_VERSION"
          test -x dist/Gajim.app/Contents/MacOS/launch
          dist/Gajim.app/Contents/MacOS/launch --help
      - uses: actions/upload-artifact@v4
        with:
          name: gajim-macos-arm64
          path: gajim-*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/gajim-') || inputs.release_tag != ''
    needs: [linux-amd64, flatpak-amd64, windows-amd64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
      - name: Assemble flat release assets and checksums
        run: |
          mkdir release-assets
          find downloaded -type f -exec cp {} release-assets/ \;
          test -f release-assets/Gajim.exe
          test -f release-assets/Gajim.msixbundle
          test -f release-assets/gajim-linux-amd64-portable.tar.zst
          test -f release-assets/gajim-linux-amd64.AppImage
          test -f release-assets/gajim-flatpak.flatpak
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 6
          test -z "$(find release-assets -maxdepth 1 -type f -size 0 -print -quit)"
          # Generate cryptographic SHA-256 checksums for each release asset
          cd release-assets
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "$file.sha256"
            fi
          done
          cd ..
      - name: Write release notes
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          release_url="https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG"
          macos_asset="$(basename "$(find release-assets -maxdepth 1 -type f -name '*.dmg')")"
          gajim_version="$(echo "$RELEASE_TAG" | sed 's/^gajim-//')"
          short_sha="${GITHUB_SHA::12}"
          cat > release-notes.md <<EOF
## Gajim Fork-Release $RELEASE_TAG

**Application version:** \`$gajim_version\`  
**Source commit:** \`$short_sha\`  
**Upstream baseline:** Gajim 2.6.0 ([gitlab.com/gajim/gajim](https://gitlab.com/gajim/gajim))  

---

### Downloads

| Platform | Format / Package | Architecture | Checksum |
| :--- | :--- | :--- | :--- |
| **Windows** | [Gajim.exe](\$release_url/Gajim.exe) | x86_64 | [SHA-256](\$release_url/Gajim.exe.sha256) |
| **Windows Store** | [Gajim.msixbundle](\$release_url/Gajim.msixbundle) | x86_64 | [SHA-256](\$release_url/Gajim.msixbundle.sha256) |
| **Linux (Portable)** | [gajim-linux-amd64-portable.tar.zst](\$release_url/gajim-linux-amd64-portable.tar.zst) | x86_64 | [SHA-256](\$release_url/gajim-linux-amd64-portable.tar.zst.sha256) |
| **Linux (AppImage)** | [gajim-linux-amd64.AppImage](\$release_url/gajim-linux-amd64.AppImage) | x86_64 | [SHA-256](\$release_url/gajim-linux-amd64.AppImage.sha256) |
| **Linux (Flatpak)** | [gajim-flatpak.flatpak](\$release_url/gajim-flatpak.flatpak) | x86_64 | [SHA-256](\$release_url/gajim-flatpak.flatpak.sha256) |
| **macOS** | [\$macos_asset](\$release_url/\$macos_asset) | Apple Silicon (arm64) | [SHA-256](\$release_url/\$macos_asset.sha256) |

Every package is accompanied by an independent SHA-256 verification checksum file.

---

### Included Packages & Features

- **Linux**: Standalone AppImage, portable self-contained archive (.tar.zst), and Flatpak single-file bundle.
- **Windows**: NSIS setup installer and MSIX application bundle.
- **macOS**: Signed-ready DMG disk image for Apple Silicon (\`arm64\`, macOS 15+).
- **Core Enhancements**:
  - Full compatibility with Gajim 2.6.0 (src layout, httpx2, updated GNOME 51 runtime).
  - Robust fallback for legacy network connectivity checks.
  - Enhanced inline formatting markers and whitespace preservation.

---

### Changes in this build

\$(git log --first-parent --format='- %s' -n 12 "$RELEASE_TAG")

> **Note:** Windows MSIX publication to the Microsoft Store remains a separate publisher submission step.
EOF
      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          # shellcheck disable=SC2016
          nix-shell -p gh --run '
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --prerelease --title "Gajim $RELEASE_TAG" --notes-file release-notes.md
            else
              gh release create "$RELEASE_TAG" --prerelease --title "Gajim $RELEASE_TAG" --notes-file release-notes.md
            fi
            for asset in $(gh release view "$RELEASE_TAG" --json assets --jq ".assets[].name"); do
              if [ ! -f "release-assets/$asset" ]; then
                gh release delete-asset "$RELEASE_TAG" "$asset" --yes
              fi
            done
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          '
